spring:
  application:
    name: sidecar

server:
  port: ${SIDECAR_PORT:8080}

management:
  server:
    port: ${SIDECAR_MANAGEMENT_PORT:8090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

proxy:
  target: ${PROXY_TARGET:http://127.0.0.1:8081}
  connect-timeout: ${PROXY_CONNECT_TIMEOUT:2s}
  read-timeout: ${PROXY_READ_TIMEOUT:10s}
  max-body-bytes: ${PROXY_MAX_BODY_BYTES:2097152}
  correlation-header: ${PROXY_CORRELATION_HEADER:x-empresa**-correlation-id}



  intercept-rules:
    - name: ${NAME_PIX_TRANSFERENCIA:pix-transfer}
      path: ${PATH_PIX_TRANSFERENCIA:/api/v1/pix/transferencia}
      methods: [ POST ]
      journey: ${JOURNEY_PIX_TRANSFERENCIA:app-bank-authz-transacional}

  proxy:
    target: ${PROXY_TARGET:http://127.0.0.1:8082}
    connect-timeout: ${PROXY_CONNECT_TIMEOUT:2s}
    read-timeout: ${PROXY_READ_TIMEOUT:10s}
    max-body-bytes: ${PROXY_MAX_BODY_BYTES:2097152}
    correlation-header: ${PROXY_CORRELATION_HEADER:x-empresa-correlation-id}

    intercept-rules:
      # Transferência — o fluxo já validado, com payload e vínculo à transação.
      - name: ${NAME_PIX_TRANSFERENCIA:pix-transfer}
        path: ${PATH_PIX_TRANSFERENCIA:/api/v1/pix/transferencia}
        methods: [ POST ]
        journey: ${JOURNEY_PIX_TRANSFERENCIA:app-bank-authz-transacional}

      # Consulta sem identificador — exercita método sem corpo.
      - name: ${NAME_PIX_CHAVES_CONSULTA:pix-chaves-consulta}
        path: ${PATH_PIX_CHAVES:/api/v1/pix/chaves}
        methods: [ GET ]
        journey: ${JOURNEY_PIX_CHAVES_CONSULTA:pdc-bank-authz-consultivo}

      # Alteração — mesmo caminho da consulta, métodos diferentes.
      # Exercita a discriminação por método.
      - name: ${NAME_PIX_CHAVES_ALTERACAO:pix-chaves-alteracao}
        path: ${PATH_PIX_CHAVES_ALTERACAO:/api/v1/pix/chaves}
        methods: [ PUT, PATCH ]
        journey: ${JOURNEY_PIX_CHAVES_ALTERACAO:app-bank-authz-transacional}

      # Exclusão — exercita o corpo em DELETE, que antes era descartado.
      - name: ${NAME_PIX_CHAVES_EXCLUSAO:pix-chaves-exclusao}
        path: ${PATH_PIX_CHAVES_EXCLUSAO:/api/v1/pix/chaves}
        methods: [ DELETE ]
        journey: ${JOURNEY_PIX_CHAVES_EXCLUSAO:app-bank-authz-transacional}

      # Consulta com identificador no caminho — exercita o segmento variável.
      - name: ${NAME_PIX_CHAVE_DETALHE:pix-chave-detalhe}
        path: ${PATH_PIX_CHAVE_DETALHE:/api/v1/pix/chaves/{chave}}
        methods: [ GET ]
        journey: ${JOURNEY_PIX_CHAVE_DETALHE:pdc-bank-authz-consultivo}

channel:
  session-header: ${CHANNEL_SESSION_HEADER:x-empresa**-authz-session}
  response-header: ${CHANNEL_RESPONSE_HEADER:x-empresa**-token}
  token-reference-header: ${CHANNEL_TOKEN_REFERENCE_HEADER:x-empresa**-authentication-am}

identity:
  base-url: ${IDENTITY_BASE_URL:https://provedor-de-desenvolvimento.invalid/am}
  realm: ${IDENTITY_REALM:alpha}
  journey-type: ${IDENTITY_JOURNEY_TYPE:service}

  channel-token-header: ${IDENTITY_CHANNEL_TOKEN_HEADER:x-empresa**-authentication}
  authenticator-code-header: ${IDENTITY_AUTHENTICATOR_CODE_HEADER:x-empresa**-token}

  client-id: ${IDENTITY_CLIENT_ID:cliente-de-desenvolvimento}
  client-secret: ${IDENTITY_CLIENT_SECRET:segredo-de-desenvolvimento}
  redirect-uri: ${IDENTITY_REDIRECT_URI:https://localhost:8080}
  scopes: ${IDENTITY_SCOPES:openid}
  session-cookie-name: ${IDENTITY_SESSION_COOKIE_NAME:cookie-de-desenvolvimento}

  connect-timeout: ${IDENTITY_CONNECT_TIMEOUT:2s}
  read-timeout: ${IDENTITY_READ_TIMEOUT:10s}

service-credentials:
  url: ${SERVICE_CREDENTIALS_URL:https://credencial-de-desenvolvimento.invalid/token}
  username: ${SERVICE_CREDENTIALS_USERNAME:usuario-de-desenvolvimento}
  password: ${SERVICE_CREDENTIALS_PASSWORD:senha-de-desenvolvimento}
  host-header: ${SERVICE_CREDENTIALS_HOST_HEADER:}
  refresh-skew: ${SERVICE_CREDENTIALS_REFRESH_SKEW:30s}
  connect-timeout: ${SERVICE_CREDENTIALS_CONNECT_TIMEOUT:2s}
  read-timeout: ${SERVICE_CREDENTIALS_READ_TIMEOUT:5s}

token-handler:
  url: ${TOKEN_HANDLER_URL:https://guardiao-de-desenvolvimento.invalid/ciam/token-handler/v1/token-refs}
  token-ref-header: ${TOKEN_HANDLER_TOKEN_REF_HEADER:X-Token-Ref}
  connect-timeout: ${TOKEN_HANDLER_CONNECT_TIMEOUT:2s}
  read-timeout: ${TOKEN_HANDLER_READ_TIMEOUT:5s}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.development.sidecar: ${LOG_LEVEL_SIDECAR:INFO}
    org.springframework.web.client: ${LOG_LEVEL_HTTP:INFO}

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-sem-correlacao}] %logger{36} - %msg%n"
